name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Weekly: Monday 06:00 UTC
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit (production deps)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 24 + deps
        uses: ./.github/actions/node-setup
      - name: Audit production dependencies
        # REPORT-ONLY for now. Known issue: next@14.2.35 has critical
        # advisories with no patched 14.x release (fix = breaking upgrade to
        # Next 16). Make this step blocking (remove continue-on-error) AFTER
        # the upgrade listed in DEPLOYMENT.md §2.2 is merged.
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Posts SARIF to the Security tab automatically.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    # Skipped on push to main: on main the blocking Trivy IMAGE scan inside
    # deploy.yml is the authoritative control, so a full repo FS scan on every
    # push would duplicate work. Still runs on PRs (early feedback), the weekly
    # schedule, and manual dispatch.
    if: ${{ github.event_name != 'push' }}
    steps:
      - uses: actions/checkout@v4
      # Report-only (exit-code 0): findings land in the Security tab, image gate
      # in deploy.yml is the blocking control. Raise exit-code to 1 to gate too.
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
          exit-code: 0
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      # JavaScript/TypeScript needs no build step for analysis.
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3