name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Weekly: Monday 06:00 UTC
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit (production deps)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 24 + deps
        uses: ./.github/actions/node-setup
      - name: Audit production dependencies
        # BLOCKING (was report-only). All production highs are cleared: the Next 16
        # upgrade, nodemailer@10.5.0 + archiver@8.0.0 (which drops the vulnerable
        # glob/archiver-utils chain) and the transitive minimatch@11.0.1 /
        # postcss-selector-parser@6.1.5 overrides in package.json. Dev-only
        # findings do not run in production, hence --omit=dev.
        run: npm audit --omit=dev --audit-level=high

  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Posts SARIF to the Security tab automatically.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    # Skipped on push to main: on main the blocking Trivy IMAGE scan inside
    # deploy.yml is the authoritative control, so a full repo FS scan on every
    # push would duplicate work. Still runs on PRs (early feedback), the weekly
    # schedule, and manual dispatch.
    if: ${{ github.event_name != 'push' }}
    steps:
      - uses: actions/checkout@v4
      # Report-only (exit-code 0): findings land in the Security tab, image gate
      # in deploy.yml is the blocking control. Raise exit-code to 1 to gate too.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
          exit-code: 0
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      # JavaScript/TypeScript needs no build step for analysis.
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3