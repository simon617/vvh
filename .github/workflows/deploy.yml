name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    name: Build, scan and push image to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Built-in token with packages: write — no PAT needed for pushes.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: |
            ghcr.io/simon617/vvh:latest
            ghcr.io/simon617/vvh:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://www.visionvalues.com.hk' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan (gate)
        # GATE: fails the job (and blocks push/deploy) on any CRITICAL vuln.
        # Adjust severity below if you want HIGH to block too.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/simon617/vvh:${{ github.sha }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: ${{ !cancelled() }}
        with:
          sarif_file: trivy-image.sarif

      - name: Push to GHCR
        run: |
          docker push ghcr.io/simon617/vvh:${{ github.sha }}
          docker push ghcr.io/simon617/vvh:latest

  deploy:
    name: Deploy to production (202.77.49.35)
    needs: build-push
    # Main control switch: set Actions variable DEPLOY_ENABLED=true once the
    # server is provisioned (Phase 5 in DEPLOYMENT.md).
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://www.visionvalues.com.hk
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd /opt/vvh
            ./deploy.sh ghcr.io/simon617/vvh:${{ github.sha }}