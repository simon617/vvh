name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  checks: read
  packages: write
  security-events: write

jobs:
  build-push:
    name: Build, scan and push image to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 60 # includes the same-push CI/Security wait (up to ~30 min) + image build + scan
    steps:
      - name: Wait for CI & Security on this commit
        # Belt-and-braces ordering control (see DEPLOYMENT.md §5.7): on a push to
        # main, do not build/deploy until the SAME commit's CI (`ci`) and Security
        # (`npm audit`, `Gitleaks`, `CodeQL`) check-runs have succeeded. The
        # primary gate is branch protection (§5.2) — nothing merges to main without
        # these checks. This step only closes the same-push ordering gap (direct
        # pushes, admin merges, bots). Manual `workflow_dispatch` deliberately
        # skips it (operator-initiated). `trivy-fs` is not waited on: it is skipped
        # on push by design — the Trivy IMAGE gate below is the runtime control.
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          REQUIRED_CHECKS: "ci, npm audit (production deps), Gitleaks secret scan, CodeQL"
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 1740 )) # 29 min wait budget; job timeout is 60 min
          echo "Waiting for: $REQUIRED_CHECKS (SHA $SHA)"
          errlog=$(mktemp)
          first_probe=1
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            echo " - $name"
            while :; do
              # `gh api --jq` already prints raw output — it has NO `-r` flag (that
              # belongs to the standalone `jq` CLI). Passing `-r` made gh treat it as
              # the jq query and the selector as a 2nd argument, so the command died
              # with "accepts 1 arg(s), received 2"; the old `2>/dev/null || true`
              # swallowed that, leaving `concls` empty forever → a silent 29-min hang.
              # No/empty conclusion while a run is queued, in progress or missing.
              if concls=$(gh api "repos/${{ github.repository }}/commits/$SHA/check-runs?filter=latest" \
                --jq '[.check_runs[] | select(.name == "'"$name"'") | .conclusion] | unique[]' 2>"$errlog"); then
                :
              elif [ "$first_probe" -eq 1 ]; then
                # Surface a broken auth/query immediately instead of hanging for 29 min.
                echo "::error::gh api check-runs query failed for '$name' on $SHA:"
                cat "$errlog"
                exit 1
              else
                concls=""
              fi
              first_probe=0
              flat=$(echo "$concls" | tr -d '\n')
              case "$flat" in
                success) break ;;
                *failure*|*timed_out*|*action_required*|*cancelled*)
                  echo "::error::$name did not pass on $SHA ($flat)"
                  exit 1
                  ;;
                *) echo "   waiting ($flat)" ; sleep 15 ;;
              esac
              (( $(date +%s) >= deadline )) && { echo "::error::timeout waiting for $name on $SHA"; exit 1; }
            done
            echo "::notice::$name green"
          done < <(echo "$REQUIRED_CHECKS" | tr ',' '\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
          echo "::notice::CI + Security green on $SHA — building"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Built-in token with packages: write — no PAT needed for pushes.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: |
            ghcr.io/simon617/vvh:latest
            ghcr.io/simon617/vvh:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://www.visionvalues.com.hk' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan (gate)
        # GATE: fails the job (and blocks push/deploy) on any CRITICAL vuln.
        # Adjust severity below if you want HIGH to block too.
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          scan-type: image
          image-ref: ghcr.io/simon617/vvh:${{ github.sha }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: ${{ !cancelled() }}
        with:
          sarif_file: trivy-image.sarif

      - name: Push to GHCR
        run: |
          docker push ghcr.io/simon617/vvh:${{ github.sha }}
          docker push ghcr.io/simon617/vvh:latest

  deploy:
    name: Deploy to production (202.77.49.35)
    needs: build-push
    # Main control switch: set Actions variable DEPLOY_ENABLED=true once the
    # server is provisioned (Phase 5 in DEPLOYMENT.md).
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://www.visionvalues.com.hk
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd /opt/vvh
            ./deploy.sh ghcr.io/simon617/vvh:${{ github.sha }}