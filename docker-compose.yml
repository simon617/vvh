version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3100:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:./data/vvh.db
      - JWT_SECRET=${JWT_SECRET}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-25}
      - SMTP_RECIPIENT=${SMTP_RECIPIENT:-}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://www.visionvalues.com.hk}
    volumes:
      - sqlite-data:/app/prisma/data
      - uploads:/app/uploads
    restart: unless-stopped

volumes:
  sqlite-data:
  uploads: