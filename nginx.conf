# vvh — production Nginx configuration.
# Deployed to /etc/nginx/sites-available/vvh.conf on the server (symlinked into
# sites-enabled). Next.js is proxied from 127.0.0.1:3000; TLS is terminated here.
#
# Behaviour:
#   http://www.visionvalues.com.hk        -> 301 https://www.visionvalues.com.hk
#   http://visionvalues.com.hk            -> 301 https://www.visionvalues.com.hk
#   https://visionvalues.com.hk           -> 301 https://www.visionvalues.com.hk
#   https://www.visionvalues.com.hk       -> app (proxy_pass 127.0.0.1:3000)

# ---------------------------------------------------------------- HTTP (80)
server {
    listen 80;
    listen [::]:80;
    server_name www.visionvalues.com.hk visionvalues.com.hk;

    # Certbot HTTP-01 challenge fallback must NOT be redirected.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://www.visionvalues.com.hk$request_uri;
    }
}

# ------------------------------------------------- HTTPS apex (443) -> www
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name visionvalues.com.hk;

    ssl_certificate     /etc/letsencrypt/live/www.visionvalues.com.hk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.visionvalues.com.hk/privkey.pem;

    # Apex -> www canonical redirect (301).
    location / {
        return 301 https://www.visionvalues.com.hk$request_uri;
    }
}

# --------------------------------------------------------- HTTPS www (443)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.visionvalues.com.hk;

    ssl_certificate     /etc/letsencrypt/live/www.visionvalues.com.hk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.visionvalues.com.hk/privkey.pem;

    # --- TLS 1.2/1.3, modern cipher set ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;

    # --- Security headers ---
    # HSTS: START with max-age=3600 after first issuance, then raise to
    # 31536000 after ~2 weeks of clean verification. See DEPLOYMENT.md, TLS §HSTS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # 'unsafe-inline' in script-src is needed for Next.js inline bootstrap
    # scripts (nonce support is still experimental in Next 14). frame-src is the
    # Datalink announcements iframe. See DEPLOYMENT.md §Security headers.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-src https://datalink.talesis.com; form-action 'self'" always;

    # Uploads allow up to ~2x the default MAX_FILE_SIZE (5 MB app limit).
    client_max_body_size 10m;

    # --- gzip ---
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml application/rss+xml image/svg+xml;

    # --- Hashed Next.js static assets: long browser cache ---
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
    }

    # --- App ---
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket upgrade headers (Next.js HMR in dev, streaming/SSE, long-poll).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;

        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }
}